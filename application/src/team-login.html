<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kullanıcı girişi · Ümraniye OSINT</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f8;color:#18213b;font:15px 'Segoe UI',Arial;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);padding:38px;background:#fff;border-radius:16px;border:1px solid #e0e3eb;box-shadow:0 20px 70px #13183e10}img{width:75px;height:75px}h1{font-size:25px;margin:22px 0 8px}p{font-size:13px;color:#747c8b;line-height:1.8}label{display:block;font-size:13px;margin:20px 0 8px}input{width:100%;padding:13px;border:1px solid #d7dce7;border-radius:7px;font:inherit}button{background:#ce0000;color:#fff;border:0;border-radius:7px;padding:14px;width:100%;font:600 14px 'Segoe UI';margin:25px 0 12px;cursor:pointer}button:disabled{opacity:.6}a{color:#a90000;font-size:13px}#error{color:#a00000;background:#fff0f0;padding:12px;border-radius:6px;display:none;white-space:pre-wrap}input:focus{outline:2px solid #ce000040}</style></head><body><main class="card"><img src="/favicon.png" alt="Ümraniye Kaymakamlığı"><h1>Kullanıcı girişi</h1><p>Gündeme ve günlük brifinglere erişmek için kullanıcı adı ve şifrenizle giriş yapın. Hesabınızı yönetici oluşturur.</p><form id="login"><label for="username">Kullanıcı adı</label><input id="username" name="username" required autocomplete="username" maxlength="40" autocapitalize="none"><label for="password">Şifre</label><input id="password" name="password" type="password" required autocomplete="current-password" maxlength="128"><p id="error" role="alert"></p><button id="submit">Giriş yap</button></form><p><a href="/yonetim">Yönetici girişi</a></p><p style="font-size:11px;color:#8c96a5">© 2026 Hakan Bilgin · Tüm hakları saklıdır.</p></main><script>const f=document.getElementById('login'),b=document.getElementById('submit'),err=document.getElementById('error');if(new URLSearchParams(location.search).get('passwordChanged')==='1'){const notice=document.createElement('p');notice.setAttribute('role','status');notice.textContent='Şifreniz değiştirildi. Yeni şifrenizle giriş yapın.';f.before(notice)}f.onsubmit=async e=>{e.preventDefault();b.disabled=true;err.style.display='none';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.username.value,password:f.password.value})});f.password.value='';const d=await r.json();if(!r.ok)throw Error(d.error);if('BroadcastChannel'in window){const channel=new BroadcastChannel('osint-account');channel.postMessage('signed-in');channel.close()}const next=new URLSearchParams(location.search).get('next');location.replace(next==='/ekip'||location.pathname==='/ekip'?'/ekip':next==='/?view=account'?'/?view=account':'/')}catch(e){err.textContent=e.message;err.style.display='block'}finally{b.disabled=false}};</script></body></html>
