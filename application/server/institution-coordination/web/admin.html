<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurum yetkileri</title><style>body{font:16px system-ui;background:#f5f6f8;color:#18212f;max-width:1100px;margin:24px auto;padding:16px}section{background:white;padding:20px;margin:16px 0;border:1px solid #e6e8ec;border-radius:12px}input,select,button{font:inherit;padding:10px;margin:6px;border:1px solid #ddd;border-radius:6px}button{cursor:pointer;color:#b91c24}label{display:inline-block}#message{color:#8f1520}article{padding:12px;border-bottom:1px solid #eee}</style><nav><a href="/">Gündem</a> · <a href="/yonetim">Yönetici paneli</a></nav><h1>Kurum yönetimi</h1><p>Kurum, konu ve kullanıcı erişimlerini buradan belirleyin.</p><p id="message" role="status"></p>
<details><summary>Kurum ve konu ayarları</summary><section><h2>Kurum ve konu onayı</h2><form id="approval"><select name="kind"><option value="institutions">Kurum</option><option value="topics">Konu</option></select><select name="code" required></select><input name="reference" placeholder="Onay açıklaması" required><input name="url" type="url" placeholder="Kurumun resmî HTTPS adresi"><label><input type="checkbox" name="enabled">Etkin</label><button>Kaydet</button></form></section></details>
<section><h2>Kurum hangi konuları görebilir?</h2><select id="institution"></select><input id="topic-search" placeholder="Konularda ara" aria-label="Konularda ara"><div id="topics"></div></section>
<section><h2>Kullanıcıya erişim ver</h2><form id="member"><select name="account" aria-label="Kullanıcı" required></select><select name="role"><option value="viewer">Yalnız görüntüleme</option><option value="case_worker">Olayları inceleme</option><option value="institution_admin">Kurum sorumlusu</option></select><label><input type="checkbox" name="active">Etkin</label><button>Seçili kuruma kaydet</button></form><form id="portal"><select name="account" aria-label="Kullanıcı" required></select><label><input type="checkbox" name="active">Tüm gündemi görme izni</label><button>Kaydet</button></form><div id="members"></div></section>
<section><h2>Kurum incelemeleri</h2><button id="reload">Yenile</button><div id="cases"></div></section><script type="module" src="/kurum/admin.js"></script></html>
