<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content=""><title>Kurum Olay Takibi</title>
  <style>
    :root{font:16px/1.5 system-ui,Segoe UI,sans-serif;color:#18212f;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.bar{background:#b91c24;color:white;padding:16px max(20px,calc((100vw - 1120px)/2))}.bar b{display:block;font-size:1.05rem}.wrap{max-width:1120px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e2e6ec;border-radius:12px;padding:20px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0}p{margin:6px 0;color:#596579}.muted{color:#667085;font-size:.9rem}button,select,input{font:inherit;border:1px solid #cbd3df;border-radius:8px;background:white;padding:9px 12px;color:inherit}button{cursor:pointer}button.primary{background:#b91c24;color:white;border-color:#b91c24}.filters{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px;margin-top:16px}.case{border:1px solid #e2e6ec;border-radius:9px;padding:14px;cursor:pointer}.case:hover,.case:focus{border-color:#b91c24;outline:2px solid #f5d5d7}.badge{font-size:.8rem;background:#eef1f4;border-radius:99px;padding:3px 9px}.alert{padding:12px;background:#fff2f2;border-radius:8px;color:#8f1520}.empty{padding:24px;text-align:center;color:#667085}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.source{border-top:1px solid #e7e9ed;padding:10px 0}.hidden{display:none}@media(max-width:640px){.detail-grid{grid-template-columns:1fr}.wrap{margin:18px auto}.card{padding:15px}}
    #case-dialog{width:min(860px,calc(100vw - 32px));max-height:90dvh;padding:0;border:1px solid #e6e8ec;border-radius:14px;box-shadow:0 24px 80px #18212f33;overflow:auto;color:#18212f;background:#fff}#case-dialog::backdrop{background:#18212f88}.dialog-head{position:sticky;top:0;background:white;padding:16px 20px;border-bottom:1px solid #e6e8ec;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:1}#detail{padding:22px}#detail h2{font-size:23px;line-height:1.4}#detail p{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}#detail textarea{display:block;width:100%;min-height:100px;margin:12px 0;font:inherit;border:1px solid #cbd3df;border-radius:8px;padding:12px}#close-case{min-height:44px}body.case-open{overflow:hidden}@media(max-width:640px){#case-dialog{width:100%;height:100dvh;max-height:100dvh;max-width:100%;margin:0;border-radius:0}#detail{padding:16px}}
  </style>
</head>
<body>
  <header class="bar"><b>T.C. ÜMRANİYE KAYMAKAMLIĞI</b><span>Kurum Olay Takip Paneli</span></header>
  <main class="wrap">
    <section class="card"><div class="row spread"><div><h1 id="institution-name">Kurum olayları</h1><p>Yalnız kurumunuza yetki verilmiş konu kayıtları gösterilir.</p></div><button id="reload" class="primary">Yenile</button></div></section>
    <section class="card"><div class="row spread"><h2>Olay listesi</h2><div class="filters"><select id="status-filter" aria-label="Duruma göre filtrele"><option value="">Tüm durumlar</option><option value="new">Yeni</option><option value="received">Alındı</option><option value="assessing">Değerlendiriliyor</option><option value="actioning">İşlemde</option><option value="resolved">Çözüldü</option><option value="dismissed">Kapsam dışı</option></select><input id="search" maxlength="100" placeholder="Başlıkta ara" aria-label="Başlıkta ara"><button id="search-button">Ara</button></div></div><div id="message" class="muted" role="status" aria-live="polite"></div><div id="cases" class="list"></div><button id="more" class="hidden">Daha eski kayıtlar</button></section>
    <dialog id="case-dialog" aria-labelledby="case-dialog-title"><header class="dialog-head"><strong id="case-dialog-title">Olay ayrıntısı</strong><button id="close-case" type="button" aria-label="Olay ayrıntısını kapat">Kapat ×</button></header><section id="detail" aria-live="polite"></section></dialog>
  </main>
  <script type="module" src="/kurum/institution.js"></script>
</body>
</html>
