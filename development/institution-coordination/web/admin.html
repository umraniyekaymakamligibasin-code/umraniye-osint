<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurum Yönetimi</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18212f;font:16px/1.5 system-ui}header,main{max-width:1200px;margin:auto;padding:20px}h1{margin:10px 0}h2{font-size:20px}a{color:#b91c24}button,input,select,textarea{font:inherit;border:1px solid #d5dae2;border-radius:8px;padding:10px;background:white}button{cursor:pointer;min-height:44px;color:#8f1520}button:disabled{opacity:.5;cursor:wait}input,select{max-width:100%}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}#search{flex:1;min-width:220px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{border:1px solid #e6e8ec;background:white;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}.card h2{margin:0}.muted{color:#667085;font-size:14px}.badge{align-self:flex-start;background:#eef1f4;border-radius:20px;padding:3px 10px;font-size:13px}.card button{margin-top:auto}.active{background:#ecfdf3;color:#16803c}dialog{width:min(850px,95vw);max-height:90vh;border:1px solid #ddd;border-radius:14px;padding:22px}dialog::backdrop{background:#18212f66}.top{display:flex;justify-content:space-between;gap:10px}#tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}#tabs [aria-pressed=true]{background:#fff0f0;border-color:#b91c24}form{display:grid;gap:12px;margin:16px 0}label{display:block}.topic{padding:8px;border-bottom:1px solid #eee}article.entry{border-bottom:1px solid #eee;padding:12px 0}pre{white-space:pre-wrap}.secret{overflow-wrap:anywhere}#message,#detail-message{color:#8f1520;white-space:pre-wrap}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d58a12}footer{padding:25px;text-align:center;color:#667085;font-size:13px}</style></head><body><header><a href="/">Gündem</a> · <a href="/yonetim">Yönetici Paneli</a><h1>Kurum Yönetimi</h1><p class="muted">Her kurumun yetkilerini, kullanıcılarını ve e-posta adreslerini kendi kartından yönetin.</p></header><main><div class="toolbar"><input id="search" type="search" placeholder="Kurum ara…" aria-label="Kurum ara"><button id="reload">Yenile</button></div><p id="message" role="status"></p><div id="cards" class="cards"></div></main><dialog id="editor" aria-labelledby="detail-title"><div class="top"><h2 id="detail-title"></h2><button id="close" aria-label="Kurum ayrıntısını kapat">Kapat</button></div><div id="tabs"></div><p id="detail-message" role="status"></p><div id="content"></div></dialog><footer>© 2026 Hakan Bilgin. Tüm hakları saklıdır.</footer><script type="module" src="/kurum/admin.js"></script></body></html>
